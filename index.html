<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e12">
  <meta name="description" content="The Builder's Journey — the interactive portfolio of Yash Khadgi, AI/ML and Full-Stack Developer.">
  <title>Yash Khadgi — The Builder's Journey</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0c0e12}
    body{font-family:Arial,sans-serif}
    .app,.page-stage{position:fixed;inset:0;background:#0c0e12;overflow:hidden}
    .page{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#0c0e12;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(0) scale(1)}
    .page{will-change:transform,opacity}
    .page.is-active{z-index:2;opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0) scale(1);transition:transform .95s cubic-bezier(.22,1,.36,1),opacity .7s ease}
    .page.is-entering{z-index:2;opacity:0;visibility:visible;transform:translateX(12vw) scale(.99)}
    .page.is-entering.from-left{transform:translateX(-12vw) scale(.99)}
    .page.is-outgoing{z-index:1;opacity:.18;visibility:visible;transform:translateX(-6vw) scale(.995);transition:transform .95s cubic-bezier(.22,1,.36,1),opacity .7s ease}
    .app.moving-back .page.is-outgoing{transform:translateX(8vw) scale(.99)}
    .chapter-cue{position:fixed;z-index:5;left:max(24px,4vw);bottom:max(28px,5vh);pointer-events:none;display:flex;align-items:center;gap:16px;color:#f3f0f7;text-shadow:0 2px 14px #0c0e12;font:500 clamp(18px,2.2vw,30px)/1.1 Georgia,serif;opacity:0;transform:translateY(18px);transition:opacity .25s ease,transform .45s ease}
    .chapter-cue.show{opacity:1;transform:translateY(0)}
    .chapter-cue small{font:700 11px/1 monospace;color:#69bfff;letter-spacing:.1em}
    .chapter-cue::before{content:"";position:absolute;left:0;bottom:-12px;width:0;height:2px;background:#69bfff;box-shadow:0 0 16px #69bfff}
    .chapter-cue.show::before{width:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
    .mobile-journey{display:none}
    .noscript{position:fixed;inset:0;display:grid;place-items:center;color:#e9e7ee;background:#0c0e12;padding:24px;text-align:center}
    .noscript a{color:#55b7ff}
    @media(max-width:1023px){
      .mobile-journey{display:block;position:fixed;z-index:30;right:14px;bottom:max(14px,env(safe-area-inset-bottom));font-family:monospace}
      .journey-toggle{float:right;border:1px solid rgba(85,183,255,.38);border-radius:999px;background:rgba(20,23,28,.9);backdrop-filter:blur(14px);color:#55b7ff;padding:11px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
      .journey-menu{display:none;clear:both;margin-bottom:8px;padding:7px;border:1px solid #34363e;border-radius:8px;background:rgba(15,17,22,.96);backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.65)}
      .mobile-journey.open .journey-menu{display:grid;gap:4px}
      .journey-menu button{border:0;border-radius:7px;background:transparent;color:#aaa5af;text-align:left;padding:10px 13px;font:600 10px monospace;letter-spacing:.05em}
      .journey-menu button.active{background:#55b7ff;color:#0c304b}
      .chapter-cue{left:18px;bottom:22px;max-width:65vw}
    }
    @media(max-width:640px){
      .mobile-journey{right:12px;bottom:max(12px,env(safe-area-inset-bottom))}
      .journey-toggle{min-width:64px;min-height:44px;padding:11px 14px}
      .journey-menu button{min-height:44px;padding:12px 14px}
      .chapter-cue{bottom:16px;gap:9px;font-size:18px}
    }
    @media(prefers-reduced-motion:reduce){.page,.page.is-active,.page.is-outgoing,.chapter-cue{transition:none!important;filter:none!important;transform:none!important}.chapter-cue{display:none}}
  </style>
<link rel="stylesheet" href="pages/site-theme.css?v=20261020-stacked-name1">
</head>
<body>
  <div class="app" id="app">
    <div class="page-stage" id="page-stage"></div>
    <div class="chapter-cue" id="chapter-cue" aria-hidden="true"><small id="chapter-number"></small><span id="chapter-title"></span></div>
    <nav class="mobile-journey" id="mobile-journey" aria-label="Portfolio pages">
      <div class="journey-menu">
        <button data-route="arrival">01 · ARRIVAL</button><button data-route="universe">02 · UNIVERSE</button><button data-route="theater">03 · THEATER</button><button data-route="research">04 · ARCHIVES</button><button data-route="contact">05 · CONTACT</button>
      </div>
      <button class="journey-toggle" id="journey-toggle" type="button" aria-expanded="false" aria-label="Open journey navigation">01 / 05</button>
    </nav>
  </div>
  <noscript><div class="noscript"><p>JavaScript is required for the connected journey.<br><a href="pages/arrival.html">Open the arrival page</a></p></div></noscript>
  <script src="portfolio-motion.js?v=20261020-stacked-name1"></script>
  <script src="page-enhancements.js?v=20261020-stacked-name1"></script>
  <script src="journey-scroll.js?v=20261015-reel1"></script>
  <script src="visit-tracker.js?v=20261021-duration1"></script>
  <script src="app.js?v=20261021-duration1"></script>
</body>
</html>
