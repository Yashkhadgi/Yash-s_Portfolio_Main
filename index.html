<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e12">
  <meta name="description" content="The Builder's Journey — the interactive portfolio of Yash Khadgi, AI/ML and Full-Stack Developer.">
  <title>Yash Khadgi — The Builder's Journey</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0c0e12}body{font-family:Arial,sans-serif}.app{position:fixed;inset:0;background:#0c0e12}.page{display:block;width:100%;height:100%;border:0;background:#0c0e12;opacity:0;transform:scale(1.008);transition:opacity .42s ease,transform .65s cubic-bezier(.2,.8,.2,1)}.page.ready{opacity:1;transform:scale(1)}.veil{position:fixed;inset:0;z-index:10;pointer-events:none;background:#0c0e12;opacity:0;transition:opacity .28s ease}.veil.show{opacity:1}.progress{position:fixed;z-index:20;left:0;top:0;width:0;height:2px;background:linear-gradient(90deg,#62dcad,#c3b2ff);box-shadow:0 0 14px rgba(195,178,255,.65);opacity:0;transition:width .4s ease,opacity .25s ease}.progress.active{width:72%;opacity:1}.progress.done{width:100%;opacity:0}.mobile-journey{display:none}.noscript{position:fixed;inset:0;display:grid;place-items:center;color:#e9e7ee;background:#0c0e12;padding:24px;text-align:center}.noscript a{color:#c3b2ff}@media(max-width:900px){.mobile-journey{display:block;position:fixed;z-index:30;right:14px;bottom:max(14px,env(safe-area-inset-bottom));font-family:monospace}.journey-toggle{float:right;border:1px solid rgba(195,178,255,.38);border-radius:999px;background:rgba(20,23,28,.9);backdrop-filter:blur(14px);color:#c3b2ff;padding:11px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}.journey-menu{display:none;clear:both;margin-bottom:8px;padding:7px;border:1px solid #34363e;border-radius:10px;background:rgba(15,17,22,.96);backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.65)}.mobile-journey.open .journey-menu{display:grid;gap:4px}.journey-menu button{border:0;border-radius:7px;background:transparent;color:#aaa5af;text-align:left;padding:10px 13px;font:600 10px monospace;letter-spacing:.05em}.journey-menu button.active{background:#c3b2ff;color:#302257}}@media(prefers-reduced-motion:reduce){.page,.veil,.progress{transition:none}}
    @media (min-width:901px) and (max-width:1023px){
      .mobile-journey{display:block;position:fixed;z-index:30;right:14px;bottom:14px;font-family:monospace}
      .journey-toggle{float:right;border:1px solid #756a98;border-radius:999px;background:#14171c;color:#c3b2ff;padding:11px 14px}
      .journey-menu{display:none;clear:both;margin-bottom:8px;padding:7px;border:1px solid #34363e;border-radius:8px;background:#0f1116}
      .mobile-journey.open .journey-menu{display:grid;gap:4px}
      .journey-menu button{border:0;border-radius:7px;background:transparent;color:#aaa5af;text-align:left;padding:10px 13px;font:600 10px monospace}
      .journey-menu button.active{background:#c3b2ff;color:#302257}
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="veil" id="veil" aria-hidden="true"></div>
    <iframe class="page" id="portfolio-page" title="Yash Khadgi portfolio" src="01_the_cinematic_arrival/code.html"></iframe>
    <nav class="mobile-journey" id="mobile-journey" aria-label="Portfolio pages">
      <div class="journey-menu">
        <button data-route="arrival">01 · ARRIVAL</button><button data-route="universe">02 · UNIVERSE</button><button data-route="theater">03 · THEATER</button><button data-route="research">04 · RESEARCH</button><button data-route="about">05 · ABOUT</button>
      </div>
      <button class="journey-toggle" id="journey-toggle" type="button" aria-expanded="false" aria-label="Open journey navigation">01 / 05</button>
    </nav>
  </div>
  <noscript><div class="noscript"><p>JavaScript is required for the connected journey.<br><a href="01_the_cinematic_arrival/code.html">Open the arrival page</a></p></div></noscript>
  <script src="page-enhancements.js"></script>
  <script src="app.js"></script>
</body>
</html>
